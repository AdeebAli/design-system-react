name: Update visual baselines

# Baselines are generated only here, in the same container as CI (Spec 01).
# Run it from the Actions tab on a chosen branch, or add the
# update-baselines label to a pull request whose branch is in this repo.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-baselines'
    runs-on: ubuntu-latest
    # Matches the exact @playwright/test version in package.json.
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:storybook
      # changed, not all: all rewrites any screenshot whose bytes differ, even
      # when it passes the comparison, so rendering noise (such as anti-aliasing
      # on a rounded border) churned baselines on every run. changed writes only
      # the ones that fail the comparison, and the missing ones.
      - run: npx playwright test --update-snapshots=changed
      - name: Commit baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/__screenshots__
          git diff --cached --quiet || git commit -m "Update visual baselines"
          git push
